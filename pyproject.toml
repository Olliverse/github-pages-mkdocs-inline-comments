[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-inline-comments"
version = "0.1.0"
description = "Inline review comments on rendered MkDocs sites, stored as GitHub issues"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["mkdocs", "mkdocs-plugin", "documentation", "comments", "review", "github-issues"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["mkdocs>=1.6"]

[project.urls]
Homepage = "https://olliverse.github.io/github-pages-mkdocs-inline-comments/"
Repository = "https://github.com/Olliverse/github-pages-mkdocs-inline-comments"
Issues = "https://github.com/Olliverse/github-pages-mkdocs-inline-comments/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."mkdocs.plugins"]
inline-comments = "mkdocs_inline_comments.plugin:InlineCommentsPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_inline_comments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
